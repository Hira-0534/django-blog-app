{% extends 'base.html' %}

{% block content %}
    <h1>Edit Blog Post</h1>
    
<form method="post" enctype="multipart/form-data">
          {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Post</button>
    </form>
    
    <br>
    <a href="{% url 'blogapp:home' %}">Cancel</a>
{% endblock %}
