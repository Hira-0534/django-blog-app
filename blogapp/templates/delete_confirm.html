{% extends 'base.html' %}

{% block content %}
    <h2>Delete Post</h2>
    <p>Are you sure you want to delete the post: "<strong>{{ post.title }}</strong>"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white;">Yes, Delete</button>
        <a href="{% url 'blogapp:my_posts' %}">Cancel</a>
    </form>
{% endblock %}
